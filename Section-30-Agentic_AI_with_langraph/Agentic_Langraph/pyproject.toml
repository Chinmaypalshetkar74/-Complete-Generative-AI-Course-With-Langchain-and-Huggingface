[project]
name = "agentic-langraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chinmay palshetkar", email = "chinmaypalshetkar952@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-cli[inmem]>=0.0.37",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.10.18",
    "python-dotenv>=1.2.2",
]

[project.scripts]
agentic-langraph = "agentic_langraph:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
